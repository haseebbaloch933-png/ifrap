version: '3.8'

# The Express/Python/Redis ETL pipeline and GeoServer that used to appear here
# were archived (see the audit report / PR history) — they were never called
# by the Next.js app. The app talks to Postgres directly via its own
# persistence seam (lib/server/pg-store.ts), so web-frontend now joins the
# database network and reads DATABASE_URL directly. See db/01_app_store.sql
# for the schema that adapter uses.

services:
  web-frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ifrap_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_MAPBOX_TOKEN=${MAPBOX_LOCAL_KEY:-pk.placeholder}
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASS:-postgres}@db-postgis:5432/ifrap_production
    networks:
      - ifrap_app_net
      - ifrap_db_net
    ports:
      - "3000:3000"
    depends_on:
      - db-postgis

  db-postgis:
    image: ankane/pgvector:v0.5.1-pg15
    container_name: ifrap_postgis
    restart: always
    environment:
      - POSTGRES_DB=ifrap_production
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASS:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - ifrap_db_net

networks:
  ifrap_app_net:
    driver: bridge
  ifrap_db_net:
    internal: true # Fully isolated database network

volumes:
  pgdata:
